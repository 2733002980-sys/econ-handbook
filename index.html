<style>
  :root {

    --kimi-color-surface-raised: #ffffff;
    --kimi-color-surface-strong: #e8eaed;
    --kimi-color-border: #dfe2e6;
    --kimi-color-danger: #e5484d;
    --kimi-color-positive: #30a46c;
    --kimi-color-warning: #f5a524;

    --kimi-chart-2: #e5484d;
    --kimi-chart-3: #30a46c;

  }
  html, body { margin: 0; padding: 0; background: #fafbfc; }
  .kimi-segmented { display: inline-flex; gap: 4px; background: var(--kimi-color-surface-muted); padding: 3px; border-radius: var(--kimi-radius-chip); }
  .kimi-chip { border: 1px solid var(--kimi-color-border); background: var(--kimi-color-surface-raised); color: var(--kimi-color-text-secondary); padding: 4px 12px; border-radius: var(--kimi-radius-chip); cursor: pointer; font-size: 13px; line-height: 18px; transition: border-color var(--t-fast); }

  .kimi-input:focus { border-color: var(--kimi-color-text-primary); }
  .kimi-button { border: 1px solid transparent; border-radius: var(--kimi-radius-button); padding: 6px 14px; font-size: 14px; cursor: pointer; transition: border-color var(--t-fast); }
  .kimi-button--secondary { background: var(--kimi-color-surface-raised); border-color: var(--kimi-color-border); color: var(--kimi-color-text-primary); }
  .kimi-button--ghost { background: transparent; color: var(--kimi-color-text-secondary); }
  .kimi-button:hover { border-color: var(--kimi-color-text-primary); }
  .eh-root {
    font-family: var(--kimi-font-sans, sans-serif);
    max-width: 860px;

  .eh-root svg text { font-family: var(--kimi-font-sans, sans-serif); }

  .eh-head { margin-bottom: var(--kimi-space-3); }
  .eh-title { font-size: 20px; font-weight: 500; line-height: 1.3; }
  .eh-meta { color: var(--kimi-color-text-tertiary); font-size: 12px; margin-top: 4px; }

  .eh-toolbar { display: flex; gap: var(--kimi-space-2); align-items: center; flex-wrap: wrap; margin-bottom: var(--kimi-space-2); }
  .eh-toolbar .kimi-segmented { flex-shrink: 0; }
  .eh-search { flex: 1; min-width: 140px; }

  .eh-list { overflow-y: auto; max-height: 540px; padding-right: 2px; }
  .eh-card {
    border: 1px solid var(--kimi-color-border);

  .eh-card-top { display: flex; align-items: baseline; gap: var(--kimi-space-2); flex-wrap: wrap; }
  .eh-concept { font-size: 16px; font-weight: 500; }
  .eh-en { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .eh-tag {
    font-size: 12px; padding: 2px 8px; border-radius: var(--kimi-radius-chip, 6px);
    background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-secondary);
    white-space: nowrap;
  }
  .eh-tag--c { background: var(--kimi-color-surface-strong); color: var(--kimi-color-text-primary); }
  .eh-tag--g0 { background: color-mix(in srgb, var(--kimi-chart-1) 12%, transparent); }
  .eh-tag--g1 { background: color-mix(in srgb, var(--kimi-chart-3) 12%, transparent); }
  .eh-tag--g2 { background: color-mix(in srgb, var(--kimi-chart-4) 12%, transparent); }
  .eh-tag--g3 { background: color-mix(in srgb, var(--kimi-chart-2) 12%, transparent); }
  .eh-principle { font-size: 13px; color: var(--kimi-color-text-secondary); margin-top: 2px; }
  .eh-def {

    font-size: 14px; line-height: 22px;
  }
  .eh-def-label { display: block; font-size: 12px; color: var(--kimi-color-text-tertiary); margin-bottom: 2px; }
  .eh-figure {
    margin-top: var(--kimi-space-2); border: 1px solid var(--kimi-color-border);
    border-radius: 8px; padding: var(--kimi-space-2);
  }
  .eh-plain { margin-top: var(--kimi-space-2); font-size: 14px; line-height: 22px; color: var(--kimi-color-text-primary); }
  .eh-ex { margin-top: var(--kimi-space-2); font-size: 13px; line-height: 20px; color: var(--kimi-color-text-secondary); }
  .eh-ex b { font-weight: 500; color: var(--kimi-color-text-primary); }

  /* graph */
  .eh-graph-scroll { overflow-x: auto; }
  .eh-node rect { fill: var(--kimi-color-surface-raised); stroke: var(--kimi-color-border); cursor: pointer; transition: stroke var(--t-fast, 120ms); }
  .eh-node text { font-size: 11px; fill: var(--kimi-color-text-primary); pointer-events: none; }
  .eh-node:hover rect { stroke: var(--kimi-color-text-primary); }
  .eh-node.is-active rect { stroke: var(--kimi-color-text-primary); stroke-width: 1.5; }
  .eh-edge { stroke: var(--kimi-color-border); fill: none; stroke-width: 1; }

  .eh-col-label { font-size: 12px; fill: var(--kimi-color-text-tertiary); }
  .eh-detail {
    margin-top: var(--kimi-space-2); border: 1px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-panel, 12px); padding: var(--kimi-space-3) var(--kimi-space-4);
    font-size: 14px; line-height: 22px;
  }
  .eh-detail-title { font-weight: 500; margin-bottom: 4px; }
  .eh-detail-rel { color: var(--kimi-color-text-secondary); font-size: 13px; padding: 3px 0; border-top: 1px dashed var(--kimi-color-border); }
  .eh-detail-rel:first-of-type { border-top: none; }
  .eh-hint { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-bottom: var(--kimi-space-2); }

  /* flashcards */
  .eh-flash-wrap { display: flex; flex-direction: column; align-items: center; gap: var(--kimi-space-3); padding-top: var(--kimi-space-2); }
  .eh-scene { perspective: 1200px; width: 100%; max-width: 520px; }
  .eh-flip { position: relative; width: 100%; height: 300px; transform-style: preserve-3d; transition: transform var(--t-normal, 200ms) var(--ease-standard, ease); cursor: pointer; }
  .eh-flip.is-flipped { transform: rotateY(180deg); }
  .eh-face {
    position: absolute; inset: 0; backface-visibility: hidden;
    border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel, 12px);
    padding: var(--kimi-space-4); display: flex; flex-direction: column; gap: var(--kimi-space-2);
    overflow-y: auto; background: var(--kimi-color-surface);
  }
  .eh-face--back { transform: rotateY(180deg); }
  .eh-flash-concept { font-size: 22px; font-weight: 500; margin: auto 0; text-align: center; }
  .eh-flash-en { text-align: center; color: var(--kimi-color-text-tertiary); font-size: 13px; }
  .eh-flash-label { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .eh-flash-def { font-size: 15px; line-height: 24px; }
  .eh-flash-plain { font-size: 13px; line-height: 20px; color: var(--kimi-color-text-secondary); }
  .eh-flash-controls { display: flex; align-items: center; gap: var(--kimi-space-2); flex-wrap: wrap; justify-content: center; }
  .eh-flash-count { color: var(--kimi-color-text-tertiary); font-size: 13px; min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

  .eh-empty { color: var(--kimi-color-text-tertiary); font-size: 14px; padding: var(--kimi-space-6) 0; text-align: center; }
  .eh-hidden { display: none; }
  .eh-footer { margin-top: var(--kimi-space-5); padding-top: var(--kimi-space-3); border-top: 1px solid var(--kimi-color-border); color: var(--kimi-color-text-quaternary); font-size: 12px; text-align: center; }
</style>

<script>
const DATA = {
  meta: { title: "经济学原理自学手册", book: "经济学原理（第 8 版）", author: "N. 格里高利·曼昆", updated: "2026-09-28", chapter_count: 2, point_count: 28 },
  chapters: [
    {
      id: 1, title: "经济学十大原理", short: "十大原理", en_title: "Ten Principles of Economics", part: "第 1 篇 导言",
      groups: ["导言", "人们如何做出决策", "人们如何相互影响", "整体经济如何运行"],
      points: [
        { id:"ch1-01", group:"导言", principle:null, concept:"稀缺性", en:"Scarcity",
          definition:"社会资源的有限性。",
          explain:"人的欲望几乎无穷无尽，但土地、劳动、资本这些用于生产物品与服务的资源是有限的。正因为“想要的多、拥有的少”，社会和个人才必须不断做选择——稀缺性是整个经济学存在的原因，也是一切经济问题的出发点。",
          example:"一块土地用来种粮食，就不能同时用来盖工厂；你的一小时用来刷手机，就不能同时用来读书。", tags:["基础概念","全书基石"] },
        { id:"ch1-02", group:"导言", principle:null, concept:"经济学", en:"Economics",
          definition:"研究社会如何管理自己的稀缺资源。",
          explain:"所谓“管理”稀缺资源，其实是在回答三个问题：资源归谁使用、由谁生产、生产成果分给谁。个体、家庭、企业、政府每时每刻都在回答这三个问题，经济学就是研究这些选择背后规律的学问。",
          example:"大学把有限的教育经费投向实验室还是教学楼？家庭把积蓄用于买房还是教育？这些都是经济学研究的资源配置问题。", tags:["基础概念","学科定义"] },
        { id:"ch1-03", group:"人们如何做出决策", principle:"原理一：人们面临权衡取舍", concept:"权衡取舍", en:"Trade-offs",
          definition:"为了得到一件东西，通常不得不放弃另一件东西。",
          explain:"资源有限决定了选择必然有代价。“天下没有免费的午餐”说的就是权衡取舍：多得到一个目标，就要在另一个目标上让步。认清取舍，是做任何经济决策前的第一课。",
          example:"经典取舍“大炮与黄油”：多造军火（大炮）就要少产民用品（黄油）；环境监管越严，企业成本越高、产出和就业可能越少。", tags:["十大原理","决策"] },
        { id:"ch1-04", group:"人们如何做出决策", principle:"原理一：人们面临权衡取舍", concept:"效率与平等", en:"Efficiency and Equality",
          definition:"效率是社会从它的稀缺资源中得到最大利益；平等是将这些利益平均地分配给社会成员。",
          explain:"效率问的是“蛋糕能不能做得更大”，平等问的是“蛋糕分得均不均”。二者往往此消彼长：把蛋糕全奖励给最能干的人，效率可能很高但不平等；用大锅饭平均分配，人人有份却可能养懒汉、蛋糕变小。政策设计经常在这两者之间摇摆。",
          example:"所得税累进税率（高收入缴更多税用于转移支付）追求更多平等，但可能削弱人们多工作的激励，从而损失一部分效率。", tags:["十大原理","政策目标"] },
        { id:"ch1-05", group:"人们如何做出决策", principle:"原理二：某种东西的成本是为得到它所放弃的东西", concept:"机会成本", en:"Opportunity Cost",
          definition:"为了得到某种东西所必须放弃的东西。",
          explain:"成本不只是你花出去的钱。上大学除了学费，还要算上四年时间里你本可以去工作挣的钱；看一场电影的成本，是这段时间你能做的第二有价值的事。算清机会成本，才算真正算清了成本。",
          example:"一名高中毕业生面临选择：上大学四年（学费 + 放弃的工作收入约数十万元），或直接就业。其中放弃的工作收入就是上大学的机会成本的重要组成部分。", tags:["十大原理","成本","高频考点"] },
        { id:"ch1-06", group:"人们如何做出决策", principle:"原理三：理性人考虑边际量", concept:"理性人", en:"Rational People",
          definition:"系统而有目的地尽最大努力实现其目标的人。",
          explain:"经济学假设多数人是有目的、会算计的：给定目标，会尽量用最优方式去实现。这里的“理性”不等于道德高尚或永远正确，只表示“会用成本—收益的方式系统地做选择”。",
          example:"一个想攒钱的人会比较每种消费的必要性；一家企业会权衡每多生产一件产品带来的收益与成本。", tags:["十大原理","行为假设"] },
        { id:"ch1-07", group:"人们如何做出决策", principle:"原理三：理性人考虑边际量", concept:"边际变动", en:"Marginal Change",
          definition:"对现有行动计划的微小增量调整。",
          explain:"理性人做决策时比较的不是“全部 vs 零”，而是“再多一点”的收益和成本：边际收益大于边际成本，就值得多走一步；反之就该停。水很便宜而钻石很贵，就是因为多一杯水的边际效用很低，多一颗钻石的边际效用很高（“钻石与水的悖论”）。",
          example:"航空公司决定是否以低价卖给候补乘客：多载一名乘客的边际成本只是一份餐食和一点燃料，边际收益是票价——只要票价高于边际成本，卖就是划算的。", tags:["十大原理","决策工具","高频考点"] },
        { id:"ch1-08", group:"人们如何做出决策", principle:"原理四：人们会对激励做出反应", concept:"激励", en:"Incentives",
          definition:"引起一个人做出某种行为的某种东西（例如惩罚或奖励的预期）。",
          explain:"当收益或成本发生变化时，人们会改变行为。激励是连接“政策”与“结果”的桥梁——政策设计者必须预判激励的改变会带来什么后果，有时还会撞上意想不到的副作用。",
          example:"安全带法律降低了司机出车祸时的死亡率，却可能因为司机觉得更安全而开车更莽撞，反而增加了行人的伤亡——激励改变了司机的边际行为。", tags:["十大原理","政策分析"] },
        { id:"ch1-09", group:"人们如何相互影响", principle:"原理五：贸易能使每个人状况更好", concept:"专业化与贸易", en:"Specialization and Trade",
          definition:"贸易使每个人可以专门从事自己有优势的活动，并相互交换，从而使各方的状况都更好。",
          explain:"贸易不是零和游戏（你赢我输），而是双赢：每个人专注做自己相对擅长的事，再用市场交换彼此需要的东西，整体产出和每个人的享受都会超过“什么都自给自足”的状态。家庭和国与国之间道理相同。",
          example:"牧牛人和种土豆的农民可以分工：牧民多吃土豆、农夫多吃牛肉，双方只要按各自擅长生产并交换，吃的总量都比各自单干时更多。", tags:["十大原理","国际贸易"] },
        { id:"ch1-10", group:"人们如何相互影响", principle:"原理六：市场通常是组织经济活动的一种好方法", concept:"市场经济", en:"Market Economy",
          definition:"当许多企业和家庭在物品与服务市场上相互交易时，通过它们的分散决策来配置资源的经济。",
          explain:"没有一个中央指挥者告诉每家企业生产什么、每个人买什么，但千百万个分散的交易决策，却能协调出令人惊讶的秩序：需要什么，价格就会引导资源流向哪里。价格既是信号（告诉你什么稀缺），又是激励（让你据此行动）。",
          example:"某地突然流行骑行，自行车涨价：涨价向厂商发出“多生产”的信号，也向消费者发出“省着买”的信号——资源自动流向最需要的地方。", tags:["十大原理","市场机制"] },
        { id:"ch1-11", group:"人们如何相互影响", principle:"原理六：市场通常是组织经济活动的一种好方法", concept:"看不见的手", en:"The Invisible Hand",
          definition:"价格指引买者与卖者达到利己行为的结果，在大多数情况下实现了整个社会福利的最大化。",

          example:"面包师烤面包不是为了行善，而是为了赚钱；但他要赚钱就得做出人们爱吃的面包——利己动机客观上满足了大众需求。", tags:["思想史","市场机制"] },
        { id:"ch1-12", group:"人们如何相互影响", principle:"原理七：政府有时可以改善市场结果（制度前提）", concept:"产权", en:"Property Rights",

          example:"一个农民不会在一块随时可能被侵占的土地上播种；一项发明如果任何人都能免费抄走，发明人就没有研发的激励。", tags:["制度基础","政府角色"] },

          example:"工厂排污让周边居民受害，但污染成本没有体现在产品价格里，市场产量就会偏高——这是典型的市场失灵。", tags:["十大原理","政府角色","高频考点"] },

          example:"汽车尾气损害路人的健康，尾气制造者却没有为此付费；打疫苗不仅保护自己，也阻断了传染链条，旁人因此受益。", tags:["市场失灵","高频考点"] },
        { id:"ch1-15", group:"人们如何相互影响", principle:"原理七：政府有时可以改善市场结果（原因二）", concept:"市场势力", en:"Market Power",

          example:"某地区唯一的供水公司若不受监管，可以把水价抬到远高于成本的水平，居民别无选择只能接受。", tags:["市场失灵","垄断"] },
        { id:"ch1-16", group:"整体经济如何运行", principle:"原理八：一国的生活水平取决于它生产物品与服务的能力", concept:"生产率", en:"Productivity",

          example:"美国工人平均工资高，是因为美国工人人均产出高；一个农民开联合收割机一小时耕的地，超过几十个人工一天的工作量。", tags:["十大原理","增长","高频考点"] },
        { id:"ch1-17", group:"整体经济如何运行", principle:"原理九：政府发行过多货币时，物价上升", concept:"通货膨胀", en:"Inflation",

        { id:"ch1-18", group:"整体经济如何运行", principle:"原理十：社会面临通货膨胀与失业之间的短期权衡取舍", concept:"通胀与失业的短期权衡", en:"Short-run trade-off between inflation and unemployment",

'1.2' marker-end='url(#cfa2)'/><text x='104' y='222' font-size='11' fill='var(--kimi-color-text-secondary)'>收入（钱）</text><path d='M 128 168 Q 172 228 215 250' fill='none' stroke='var(--kimi-color-text-tertiary)' stroke-width='1.2' stroke-dasharray='5 4' marker-end='url(#cfa2)'/><text x='96' y='206' font-size='11' fill='var(--kimi-color-text-tertiary)'>劳动、土地、资本</text><path d='M 345 250 Q 388 228 432 168' fill='none' stroke='var(--kimi-color-text-tertiary)' stroke-width='1.2' stroke-dasharray='5 4' marker-end='url(#cfa2)'/><text x='352' y='206' font-size='11' fill='var(--kimi-color-text-tertiary)'>生产要素</text><path d='M 425 128 Q 388 82 348 50' fill='none' stroke='var(--kimi-color-text-tertiary)' stroke-width='1.2' stroke-dasharray='5 4' marker-end='url(#cfa2)'/><text x='368' y='100' font-size='11' fill='var(--kimi-color-text-tertiary)'>物品与服务</text><path d='M 212 50 Q 172 82 135 128' fill='none' stroke='var(--kimi-color-text-tertiary)' stroke-width='1.2' stroke-dasharray='5 4' marker-end='url(#cfa2)'/><text x='124' y='100' font-size='11' fill='var(--kimi-color-text-tertiary)'>物品与服务</text><text x='16' y='24' font-size='11' fill='var(--kimi-color-text-quaternary)'>实线＝货币流　虚线＝实物流（方向相反）</text></svg>",
  "ppf": "<svg viewBox='0 0 560 340' width='100%' style='display:block'><path d='M 60 300 L 540 300 M 60 300 L 60 30' stroke='var(--kimi-color-text-primary)' stroke-width='1.2'/><path d='M 60 40 C 100 44, 128 52, 152 57 C 196 67, 220 78, 244 92 C 292 117, 314 134, 336 153 C 382 178, 408 200, 428 222 C 456 254, 494 278, 520 300' fill='none' stroke='var(--kimi-chart-1)' stroke-width='2'/><circle cx='244' cy='92' r='4' fill='var(--kimi-color-text-primary)'/><text x='254' y='88' font-size='12' fill='var(--kimi-color-text-primary)'>A（有效率）</text><circle cx='152' cy='170' r='4' fill='var(--kimi-color-text-secondary)'/><path d='M 152 170 L 152 300 M 152 170 L 60 170' stroke='var(--kimi-color-text-tertiary)' stroke-width='1' stroke-dasharray='4 3'/><text x='162' y='164' font-size='12' fill='var(--kimi-color-text-secondary)'>E（可达到但浪费）</text><text x='476' y='150' font-size='12' fill='var(--kimi-color-text-tertiary)'>达不到的区域</text><text x='545' y='322' font-size='12' text-anchor='end' fill='var(--kimi-color-text-primary)'>小麦（吨）</text><text x='70' y='46' font-size='12' fill='var(--kimi-color-text-primary)'>电脑（台）</text><text x='530' y='292' font-size='11' text-anchor='end' fill='var(--kimi-color-text-tertiary)'>500</text><text x='66' y='292' font-size='11' fill='var(--kimi-color-text-tertiary)'>300</text><text x='60' y='330' font-size='11' fill='var(--kimi-color-text-quaternary)'>边界向外凸出：机会成本递增 · 斜率＝机会成本 · 边界外移＝经济增长</text></svg>"
};

const CHAPTERS = DATA.chapters;
const POINTS = CHAPTERS.flatMap(c => c.points.map(p => Object.assign({ chapter: c.id, chapter_short: c.short }, p)));
const SHORT = {};
POINTS.forEach(p => SHORT[p.id] = p.concept.length > 7 ? p.concept.slice(0, 7) : p.concept);
SHORT["ch2-08"] = "建议为何不总被采纳";
SHORT["ch2-10"] = "共识多于分歧";
SHORT["ch2-18"] = "通胀-失业权衡";
SHORT["ch1-18"] = "通胀-失业权衡";
const byId = {}; POINTS.forEach(p => byId[p.id] = p);
const GROUP_COLOR = { "导言":0, "人们如何做出决策":1, "人们如何相互影响":2, "整体经济如何运行":3, "作为科学家":1, "作为政策顾问":2, "为什么意见分歧":3 };

document.getElementById("ehMeta").textContent =
  DATA.meta.book + " · " + DATA.meta.author + " · 已入库 " + DATA.meta.chapter_count + " 章 / " + DATA.meta.point_count + " 个知识点";

/* ---------- view switching ---------- */
const viewBtns = document.querySelectorAll(".eh-toolbar .kimi-chip[data-view]");
const views = { browse: document.getElementById("viewBrowse"), graph: document.getElementById("viewGraph"), flash: document.getElementById("viewFlash") };
viewBtns.forEach(btn => btn.addEventListener("click", () => {
  viewBtns.forEach(b => b.setAttribute("aria-selected", b === btn ? "true" : "false"));
  Object.entries(views).forEach(([k, el]) => el.classList.toggle("eh-hidden", k !== btn.dataset.view));
}));

/* ---------- browse ---------- */
let browseChapter = "all", activeGroup = "全部";
const chapChips = document.getElementById("ehChapChips");
["全部章节"].concat(CHAPTERS.map(c => "第 " + c.id + " 章")).forEach(c => {
  const b = document.createElement("button");
  b.className = "kimi-chip"; b.textContent = c; b.setAttribute("aria-pressed", c === "全部章节" ? "true" : "false");
  b.addEventListener("click", () => {
    browseChapter = c === "全部章节" ? "all" : parseInt(c.replace("第 ","").replace(" 章",""));
    activeGroup = "全部";
    chapChips.querySelectorAll(".kimi-chip").forEach(x => x.setAttribute("aria-pressed", x.textContent === c ? "true" : "false"));
    renderGroupChips(); renderList();
  });
  chapChips.appendChild(b);
});

const groupChips = document.getElementById("ehGroupChips");
function renderGroupChips(){
  const groups = ["全部"].concat(browseChapter === "all"
    ? Array.from(new Set(POINTS.map(p => p.group)))
    : CHAPTERS.find(c => c.id === browseChapter).groups);
  groupChips.innerHTML = "";
  groups.forEach(g => {
    const b = document.createElement("button");
    b.className = "kimi-chip"; b.textContent = g; b.setAttribute("aria-pressed", g === activeGroup ? "true" : "false");
    b.addEventListener("click", () => {
      activeGroup = g;
      groupChips.querySelectorAll(".kimi-chip").forEach(x => x.setAttribute("aria-pressed", x.textContent === g ? "true" : "false"));
      renderList();
    });
    groupChips.appendChild(b);
  });
}

function esc(s){ const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function renderList(){
  const q = document.getElementById("ehSearch").value.trim().toLowerCase();
  const list = document.getElementById("ehList");
  const filtered = POINTS.filter(p => {
    if (browseChapter !== "all" && p.chapter !== browseChapter) return false;
    if (activeGroup !== "全部" && p.group !== activeGroup) return false;
    if (!q) return true;
    return [p.concept, p.en, p.definition, p.explain, p.example, (p.tags||[]).join(" ")].join(" ").toLowerCase().includes(q);
  });
  if (!filtered.length) { list.innerHTML = '<div class="eh-empty">没有匹配的知识点</div>'; return; }
  list.innerHTML = filtered.map(p => {
    const gi = GROUP_COLOR[p.group] != null ? GROUP_COLOR[p.group] : 0;
    return '<div class="eh-card">' +
      '<div class="eh-card-top"><span class="eh-tag eh-tag--c">第 ' + p.chapter + ' 章 · ' + esc(p.chapter_short) + '</span>' +
      '<span class="eh-tag eh-tag--g' + gi + '">' + esc(p.group) + '</span>' +
      '<span class="eh-concept">' + esc(p.concept) + '</span>' +
      '<span class="eh-en">' + esc(p.en) + '</span></div>' +
      (p.principle ? '<div class="eh-principle">' + esc(p.principle) + '</div>' : '') +
      '<div class="eh-def"><span class="eh-def-label">书中定义</span>' + esc(p.definition) + '</div>' +
      (p.figure && FIGURES[p.figure] ? '<div class="eh-figure">' + FIGURES[p.figure] + '</div>' : '') +
      '<div class="eh-plain">' + esc(p.explain) + '</div>' +
      '<div class="eh-ex"><b>例子</b>　' + esc(p.example) + '</div>' +
      '</div>';
  }).join("");
}
document.getElementById("ehSearch").addEventListener("input", renderList);
renderGroupChips();
renderList();

/* ---------- graph ---------- */
let graphChapter = 1;
const graphChapChips = document.getElementById("ehGraphChapChips");
CHAPTERS.forEach(c => {
  const b = document.createElement("button");
  b.className = "kimi-chip"; b.textContent = "第 " + c.id + " 章";
  b.setAttribute("aria-pressed", c.id === graphChapter ? "true" : "false");
  b.addEventListener("click", () => {
    graphChapter = c.id;
    graphChapChips.querySelectorAll(".kimi-chip").forEach(x => x.setAttribute("aria-pressed", x.textContent === b.textContent ? "true" : "false"));
    buildGraph();
  });
  graphChapChips.appendChild(b);
});

function buildGraph(){
  const ch = CHAPTERS.find(c => c.id === graphChapter);
  const pts = ch.points;
  const nCol = ch.groups.length;
  const W = nCol === 4 ? 620 : 650;
  const H = 400;
  const colX = [];
  for (let i = 0; i < nCol; i++) colX.push(60 + (W - 120) * i / (nCol - 1));
  const cols = ch.groups.map((g,i) => pts.filter(p => p.group === g));
  const pos = {};
  cols.forEach((arr, ci) => {
    const n = arr.length, gap = Math.min(52, (H - 130) / Math.max(n - 1, 1));
    const start = 56 + (H - 110 - gap * (n - 1)) / 2;
    arr.forEach((p, i) => { pos[p.id] = { x: colX[ci], y: n === 1 ? start + (H - 110) / 2 : start + i * gap }; });
  });

  const inCh = id => id in pos;
  let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  ch.groups.forEach((label, i) => { svg += '<text class="eh-col-label" x="' + colX[i] + '" y="30" text-anchor="middle">' + esc(label) + '</text>'; });

  DATA.links.forEach(l => {
    if (!inCh(l.from) || !inCh(l.to)) return;
    const a = pos[l.from], b = pos[l.to];
    const dx = Math.abs(b.x - a.x), dy = b.y - a.y;
    const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2 + (dx < 20 ? (dy >= 0 ? 42 : -42) : dy * 0.12);
    svg += '<path class="eh-edge" data-edge="' + l.from + '|' + l.to + '" d="M ' + a.x + ' ' + a.y + ' Q ' + cx + ' ' + cy + ' ' + b.x + ' ' + b.y + '"/>';
  });

  pts.forEach(p => {
    const pt = pos[p.id];
    svg += '<g class="eh-node" data-id="' + p.id + '" transform="translate(' + pt.x + ',' + pt.y + ')">' +
      '<rect x="-66" y="-16" width="132" height="32" rx="16"/>' +
      '<text x="0" y="4" text-anchor="middle">' + esc(SHORT[p.id]) + '</text></g>';
  });
  svg += '</svg>';
  document.getElementById("ehGraph").innerHTML = svg;
  document.getElementById("ehDetail").classList.add("eh-hidden");

  const detail = document.getElementById("ehDetail");
  document.querySelectorAll(".eh-node").forEach(node => {
    node.addEventListener("click", () => {
      const id = node.dataset.id;
      const already = node.classList.contains("is-active");
      document.querySelectorAll(".eh-node.is-active").forEach(n => n.classList.remove("is-active"));
      document.querySelectorAll(".eh-edge.is-active").forEach(e => e.classList.remove("is-active"));
      if (already) { detail.classList.add("eh-hidden"); return; }
      node.classList.add("is-active");
      const rels = DATA.links.filter(l => l.from === id || l.to === id);
      rels.forEach(l => {
        const el = document.querySelector('[data-edge="' + l.from + '|' + l.to + '"]');
        if (el) el.classList.add("is-active");
      });
      const p = byId[id];
      let html = '<div class="eh-detail-title">' + esc(p.concept) + ' <span class="eh-en">' + esc(p.en) + '</span>　<span class="eh-tag eh-tag--c">第 ' + p.chapter + ' 章</span></div>' +
                 '<div>' + esc(p.definition) + '</div>';
      rels.forEach(l => {
        const otherId = l.from === id ? l.to : l.from;
        const dir = l.from === id ? "→" : "←";
        const cross = byId[otherId].chapter !== p.chapter ? "（跨章）" : "";
        html += '<div class="eh-detail-rel">' + dir + ' <b>' + esc(SHORT[otherId]) + '</b>' + cross + '：' + esc(l.relation.replace("（跨章关联）","")) + '</div>';
      });
      detail.innerHTML = html;
      detail.classList.remove("eh-hidden");
    });
  });
}
buildGraph();

/* ---------- flashcards ---------- */
let deck = POINTS.map((_, i) => i), cardIdx = 0, flipped = false;
const flipEl = document.getElementById("ehFlip");
function renderCard(){
  const p = POINTS[deck[cardIdx]];
  flipped = false; flipEl.classList.remove("is-flipped");
  document.getElementById("ehFaceFront").innerHTML =
    '<div><span class="eh-tag eh-tag--c">第 ' + p.chapter + ' 章</span> <span class="eh-tag">' + esc(p.group) + '</span></div>' +
    '<div class="eh-flash-concept">' + esc(p.concept) + '</div>' +
    '<div class="eh-flash-en">' + esc(p.en) + '</div>' +
    (p.principle ? '<div class="eh-flash-en">' + esc(p.principle) + '</div>' : '');
  document.getElementById("ehFaceBack").innerHTML =
    '<div><span class="eh-flash-label">书中定义</span><div class="eh-flash-def">' + esc(p.definition) + '</div></div>' +
    '<div><span class="eh-flash-label">通俗理解</span><div class="eh-flash-plain">' + esc(p.explain) + '</div></div>' +
    '<div><span class="eh-flash-label">例子</span><div class="eh-flash-plain">' + esc(p.example) + '</div></div>';
  document.getElementById("ehCount").textContent = (cardIdx + 1) + " / " + deck.length;
}
flipEl.addEventListener("click", () => { flipped = !flipped; flipEl.classList.toggle("is-flipped", flipped); });
document.getElementById("ehPrev").addEventListener("click", () => { cardIdx = (cardIdx - 1 + deck.length) % deck.length; renderCard(); });
document.getElementById("ehNext").addEventListener("click", () => { cardIdx = (cardIdx + 1) % deck.length; renderCard(); });
document.getElementById("ehShuffle").addEventListener("click", () => {
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  cardIdx = 0; renderCard();
});
renderCard();
</script>
